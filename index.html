<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PassForge - Simple and secure password generator"
    >

    <title>PassForge — Password Generator</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="container">

        <section class="password-card">

            <header class="card-header">
                <h1>PassForge</h1>
                <p>Generate a strong password instantly.</p>
            </header>


            <!-- Password Display -->
            <div class="password-section">

                <label for="password">
                    Generated Password
                </label>

                <div class="password-box">

                    <input
                        type="text"
                        id="password"
                        placeholder="Your password"
                        readonly
                    >

                    <button
                        type="button"
                        id="copyBtn"
                        title="Copy password"
                    >
                        Copy
                    </button>

                </div>

            </div>


            <!-- Password Length -->
            <div class="option-group">

                <div class="option-header">
                    <label for="length">
                        Password Length
                    </label>

                    <span id="lengthValue">16</span>
                </div>

                <input
                    type="range"
                    id="length"
                    min="4"
                    max="50"
                    value="16"
                >

            </div>


            <!-- Character Options -->
            <div class="options">

                <label class="option">
                    <input
                        type="checkbox"
                        id="uppercase"
                        checked
                    >

                    <span>Uppercase</span>
                </label>


                <label class="option">
                    <input
                        type="checkbox"
                        id="lowercase"
                        checked
                    >

                    <span>Lowercase</span>
                </label>


                <label class="option">
                    <input
                        type="checkbox"
                        id="numbers"
                        checked
                    >

                    <span>Numbers</span>
                </label>


                <label class="option">
                    <input
                        type="checkbox"
                        id="symbols"
                        checked
                    >

                    <span>Symbols</span>
                </label>

            </div>


            <!-- Generate Button -->
            <button
                type="button"
                id="generateBtn"
                class="generate-btn"
            >
                Generate Password
            </button>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
